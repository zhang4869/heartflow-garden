var ROOM_CSS = "/* ============================================================\n   心流花园 · 2.5D 卧室\n   One 1672x941 stage, scaled to cover the viewport.\n   Layers: day/night image · light and motes · fixed original artwork ·\n           light veil · motes · hotspots (monitor, cat)\n   ============================================================ */\n\nhtml, body { margin: 0; height: 100%; }\nbody { background: #f6e9e0; }\nbody.room-mode { overflow: hidden; }\n\n#wbRoot { position: relative; z-index: 1; }\n\n/* ---------- stage ---------- */\n#hfRoom {\n  position: fixed; inset: 0; z-index: 5000; overflow: hidden;\n  background: #2a1c20; opacity: 1;\n  transition: opacity .42s ease;\n}\n#hfRoom.is-fading { opacity: 0; }\n#hfRoom.is-hidden { display: none; }\n\n#hfRoom .stage {\n  position: absolute; left: 0; top: 0;\n  width: 1672px; height: 941px;\n  transform-origin: 0 0;\n  transition: transform 1050ms cubic-bezier(.24,.66,.22,1);\n  will-change: transform;\n  --s: 1; --inv: 1;\n}\n#hfRoom .cam, #hfRoom .push { position: absolute; inset: 0; }\n#hfRoom .cam { animation: none; transform: none; transform-origin: 50% 58%; }\n#hfRoom .push {\n  transform-origin: 56% 71%;\n  transition: transform 1100ms cubic-bezier(.2,.7,.25,1);\n}\n#hfRoom .push.is-petting { transform: none; }\n\n.hf-img {\n  position: absolute; inset: 0; width: 100%; height: 100%;\n  object-fit: cover; pointer-events: none; user-select: none;\n  -webkit-user-drag: none;\n}\n.hf-img.night { opacity: 0; transition: opacity .9s ease; }\n#hfRoom.is-night .hf-img.night { opacity: 1; }\n\n\n/* ---------- masked living layers ----------\n   .fx carries the static matte; .fx-move carries the sway, so the window\n   frame and the wallpaper outside the matte never travel. */\n.fx { position: absolute; inset: 0; pointer-events: none; }\n.fx-move { position: absolute; inset: 0; will-change: transform; }\n.fx-img {\n  position: absolute; inset: 0;\n  background-repeat: no-repeat; background-size: 100% 100%;\n  transition: opacity .9s ease;\n}\n.fx-img.day { background-image: var(--day); }\n.fx-img.night { background-image: var(--night); opacity: 0; }\n#hfRoom.is-night .fx-img.night { opacity: 1; }\n#hfRoom.is-night .fx-img.day { opacity: 0; }\n\n.fx-willow .fx-move {\n  transform-origin: 82% 46%;\n  animation: hfWillow 10s ease-in-out infinite;\n}\n.fx-curtain-l .fx-move {\n  transform-origin: 45.5% 0%;\n  animation: hfCurtainL 8s ease-in-out infinite;\n}\n.fx-curtain-r .fx-move {\n  transform-origin: 85.5% 0%;\n  animation: hfCurtainR 9.5s ease-in-out infinite;\n  animation-delay: -3.2s;\n}\n\n/* ---------- light ---------- */\n.fx-light { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; transition: opacity .9s ease; }\n.fx-light.day {\n  background:\n    radial-gradient(46% 62% at 70% 26%, rgba(255,240,206,.60), rgba(255,236,200,.18) 46%, transparent 72%),\n    linear-gradient(104deg, transparent 34%, rgba(255,242,214,.32) 52%, transparent 70%);\n  animation: hfLightDay 13s ease-in-out infinite;\n}\n.fx-light.night {\n  opacity: 0;\n  background:\n    radial-gradient(34% 52% at 71% 24%, rgba(150,186,255,.30), transparent 70%),\n    radial-gradient(40% 44% at 18% 62%, rgba(255,186,128,.26), transparent 72%);\n  animation: hfLightNight 9s ease-in-out infinite;\n}\n#hfRoom.is-night .fx-light.day { opacity: 0; }\n#hfRoom.is-night .fx-light.night { opacity: 1; }\n\n#hfRoom .vignette {\n  position: absolute; inset: 0; pointer-events: none;\n  background: radial-gradient(120% 92% at 50% 46%, transparent 56%, rgba(74,40,44,.18) 100%);\n  transition: background .9s ease;\n}\n#hfRoom.is-night .vignette {\n  background: radial-gradient(120% 92% at 50% 46%, transparent 44%, rgba(20,18,52,.44) 100%);\n}\n#hfRoom .night-warm {\n  position: absolute; inset: 0; pointer-events: none; opacity: 0;\n  background: radial-gradient(30% 34% at 22% 34%, rgba(255,176,120,.20), transparent 70%);\n  transition: opacity .9s ease;\n}\n#hfRoom.is-night .night-warm { opacity: 1; }\n\n/* ---------- motes ---------- */\n#hfRoom .motes { position: absolute; inset: 0; pointer-events: none; }\n.hf-mote {\n  position: absolute; border-radius: 50%; opacity: 0;\n  background: radial-gradient(circle, #fffaf0 0%, rgba(255,226,174,.85) 45%, rgba(255,214,150,0) 72%);\n  animation: hfMote var(--dur, 16s) linear infinite;\n  animation-delay: var(--delay, 0s);\n  will-change: transform, opacity;\n}\n#hfRoom.is-night .hf-mote {\n  background: radial-gradient(circle, #eaf4ff 0%, rgba(190,224,255,.9) 42%, rgba(160,200,255,0) 72%);\n  animation-name: hfFirefly;\n}\n\n/* ---------- monitor hotspot ---------- */\n.hf-screen-hot {\n  position: absolute; z-index: 6; border: 0; padding: 0; margin: 0;\n  background: transparent; cursor: pointer; border-radius: 5px;\n  -webkit-tap-highlight-color: transparent;\n}\n.hf-screen-hot::before {\n  content: \"\"; position: absolute; inset: -9px; border-radius: 9px;\n  box-shadow: 0 0 0 1px rgba(255,255,255,.22), 0 0 26px rgba(255,214,160,.38);\n  animation: hfScreenGlow 3.6s ease-in-out infinite;\n  pointer-events: none;\n}\n.hf-screen-hot::after {\n  content: \"\"; position: absolute; inset: 0; border-radius: 4px;\n  background: linear-gradient(118deg, rgba(255,255,255,.16), transparent 42%, rgba(255,255,255,.10) 74%, transparent);\n  opacity: .7; pointer-events: none;\n  animation: hfGlass 7s ease-in-out infinite;\n}\n.hf-screen-hot:focus-visible { outline: none; }\n.hf-screen-hot:focus-visible::before { box-shadow: 0 0 0 2px #ffd7ae, 0 0 32px rgba(255,214,160,.6); }\n\n.hf-login {\n  position: absolute; left: 50%; top: 50%; width: 66%;\n  transform: translate(-50%, -50%);\n  padding: 5.5% 6% 6%;\n  border-radius: 6px;\n  background: rgba(255,251,245,.56);\n  border: 1px solid rgba(255,255,255,.62);\n  box-shadow: 0 3px 12px rgba(104,63,58,.20), inset 0 1px 0 rgba(255,255,255,.7);\n  -webkit-backdrop-filter: blur(2px) saturate(1.05); backdrop-filter: blur(2px) saturate(1.05);\n  display: flex; flex-direction: column; align-items: center; gap: 3.5px;\n  transition: transform .35s ease, background .35s ease, box-shadow .35s ease;\n  pointer-events: none;\n}\n.hf-screen-hot:hover .hf-login, .hf-screen-hot:focus-visible .hf-login {\n  transform: translate(-50%, -50%) scale(1.05);\n  background: rgba(255,252,247,.8);\n  box-shadow: 0 8px 22px rgba(104,63,58,.26), inset 0 1px 0 rgba(255,255,255,.9);\n}\n.hf-login-tag {\n  font: 800 6.6px/1.2 -apple-system, \"PingFang SC\", \"Microsoft YaHei\", sans-serif;\n  letter-spacing: .09em; color: #a1667a; text-transform: uppercase;\n}\n.hf-pass {\n  width: 100%; display: flex; align-items: center; gap: 4px;\n  padding: 2.6px 3.6px 2.6px 5px; border-radius: 999px;\n  background: #fffdfa; border: 1px solid #eccdc4;\n  box-shadow: 0 2px 6px rgba(120,76,70,.14);\n  font: 700 6.8px/1 -apple-system, \"PingFang SC\", \"Microsoft YaHei\", sans-serif;\n  color: #8d5f6c;\n}\n.hf-pass .dots { flex: 1; text-align: left; letter-spacing: .12em; color: #a98d97; }\n.hf-pass .go {\n  padding: 2.2px 5px; border-radius: 999px; background: #f9e2d9; color: #96604c;\n  font-size: 6.4px; white-space: nowrap;\n}\n.hf-screen-hot:hover .hf-pass .go { background: #f6d3c6; }\n\n/* floating entry chip */\n.hf-chip {\n  position: absolute; z-index: 7; border: 0; margin: 0;\n  left: 1080.5px; top: 432px;\n  transform: translate(-50%, 0) scale(var(--inv, 1));\n  transform-origin: 50% 0;\n  display: inline-flex; align-items: center; gap: .4em;\n  padding: .5em .85em; border-radius: 999px;\n  background: rgba(255,250,244,.82); color: #8a5565;\n  border: 1px solid rgba(255,255,255,.9);\n  box-shadow: 0 6px 18px rgba(112,70,72,.2);\n  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);\n  font: 700 11.5px/1 -apple-system, \"PingFang SC\", \"Microsoft YaHei\", sans-serif;\n  cursor: pointer; white-space: nowrap;\n  animation: hfChipFloat 4.2s ease-in-out infinite;\n  transition: background .25s ease, box-shadow .25s ease;\n}\n.hf-chip b { font-weight: 800; }\n.hf-chip:hover { background: #fffdf9; box-shadow: 0 8px 22px rgba(112,70,72,.26); }\n.hf-chip:focus-visible { outline: 2px solid #e6a7bd; outline-offset: 2px; }\n.hf-chip::before {\n  content: \"\"; position: absolute; left: 50%; top: -5px; width: 9px; height: 9px;\n  transform: translateX(-50%) rotate(45deg);\n  background: rgba(255,250,244,.92); border-left: 1px solid rgba(255,255,255,.9);\n  border-top: 1px solid rgba(255,255,255,.9);\n}\n\n/* ---------- cat ---------- */\n.hf-cat-hot {\n  position: absolute; z-index: 6; border: 0; padding: 0; margin: 0;\n  background: transparent; border-radius: 50%; cursor: pointer;\n  -webkit-tap-highlight-color: transparent;\n}\n.hf-cat-hot::before {\n  content: \"\"; position: absolute; inset: 4%;\n  border-radius: 50%;\n  background: radial-gradient(circle, rgba(255,224,186,.34), rgba(255,214,170,0) 68%);\n  opacity: 0; transition: opacity .35s ease;\n  pointer-events: none;\n}\n.hf-cat-hot:hover::before, .hf-cat-hot:focus-visible::before { opacity: 1; }\n.hf-cat-hot.is-petted::before { opacity: 1; }\n.hf-cat-hot:focus-visible { outline: none; }\n.hf-cat-hot:focus-visible::before { box-shadow: 0 0 0 2px rgba(255,215,174,.75); }\n\n.hf-pulses { position: absolute; inset: 0; pointer-events: none; z-index: 3; }\n.hf-hearts { position: absolute; inset: 0; pointer-events: none; z-index: 9; }\n.hf-pulse {\n  position: absolute; border-radius: 50%; border: 0;\n  background: radial-gradient(circle, rgba(255,221,178,.30) 0%, rgba(255,210,164,.16) 42%, rgba(255,200,150,0) 68%);\n  animation: hfPulse 1.4s cubic-bezier(.2,.6,.3,1) forwards;\n}\n.hf-heart {\n  position: absolute; z-index: 9; font-size: 22px; line-height: 1;\n  pointer-events: none; will-change: transform, opacity;\n  animation: hfHeart 1.9s cubic-bezier(.2,.6,.3,1) forwards;\n  filter: drop-shadow(0 2px 4px rgba(150,90,100,.25));\n}\n.hf-bubble {\n  position: absolute; z-index: 12; transform-origin: 50% 100%;\n  padding: .6em .95em; border-radius: 14px;\n  background: rgba(255,252,246,.96);\n  border: 1px solid #ffe1d2;\n  color: #7d5162; font: 700 14px/1.35 -apple-system, \"PingFang SC\", \"Microsoft YaHei\", sans-serif;\n  box-shadow: 0 8px 24px rgba(120,74,78,.22);\n  white-space: nowrap; opacity: 0;\n  transform: translate(-50%, -100%) scale(var(--inv, 1)) translateY(6px);\n  transition: opacity .28s ease, transform .35s cubic-bezier(.2,.7,.3,1.2);\n  pointer-events: none;\n}\n.hf-bubble.show { opacity: 1; transform: translate(-50%, -100%) scale(var(--inv, 1)) translateY(0); }\n.hf-bubble::after {\n  content: \"\"; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px;\n  transform: translateX(-50%) rotate(45deg);\n  background: rgba(255,252,246,.96);\n  border-right: 1px solid #ffe1d2; border-bottom: 1px solid #ffe1d2;\n}\n\n/* ---------- HUD ---------- */\n.hf-hud-top {\n  position: absolute; z-index: 20; top: 0; left: 0; right: 0;\n  display: flex; align-items: flex-start; justify-content: space-between;\n  gap: 12px; padding: clamp(10px, 2.2vh, 24px) clamp(12px, 2vw, 30px);\n  pointer-events: none;\n}\n.hf-brand {\n  display: flex; flex-direction: column; gap: 2px;\n  padding: clamp(7px, 1vh, 11px) clamp(12px, 1.4vw, 18px);\n  border-radius: 16px; background: rgba(255,250,244,.78);\n  border: 1px solid rgba(255,255,255,.82);\n  box-shadow: 0 8px 24px rgba(111,66,60,.14);\n  -webkit-backdrop-filter: blur(11px); backdrop-filter: blur(11px);\n  color: #774e5b;\n}\n.hf-brand b { font: 800 clamp(13px, 1.25vw, 18px)/1.25 -apple-system, \"PingFang SC\", \"Microsoft YaHei\", sans-serif; }\n.hf-brand small { font: 500 clamp(9px, .82vw, 12px)/1.3 -apple-system, \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #a3818c; }\n.hf-tools { display: flex; gap: 8px; pointer-events: auto; }\n.hf-btn {\n  display: inline-flex; align-items: center; gap: .4em;\n  padding: clamp(7px, 1vh, 10px) clamp(10px, 1vw, 15px);\n  border-radius: 999px; border: 1px solid rgba(255,255,255,.9);\n  background: rgba(255,250,244,.9); color: #7c5 const hfMusicButton = hfMusicBox.querySelector('#hfRoomMusicBtn');

function hfMusicRender(){

/* ---------- refs ---------- */
const $ = (id) => root.querySelector('#' + id);
const stage = root.querySelector('.stage');
const push = root.querySelector('.push');
const screenHot = $('hfScreen');
const chip = $('hfChip');
const catHot = $('hfCat');
const catActor = $('hfCatActor');
const bubble = $('hfBubble');
const hearts = $('hfHearts');
const pulses = $('hfPulses');
const modeBtn = $('hfMode');
const fullBtn = $('hfFull');
const flare = $('hfFlare');
const motes = root.querySelector('.motes');
const willowToggle=$('hfWillowToggle');
willowToggle.onclick=()=>{const paused=root.classList.toggle('willow-paused');willowToggle.setAttribute('aria-pressed',String(!paused));willowToggle.textContent=paused?'🌿 柳枝轻摆：关':'🌿 柳枝轻摆：开';};


document.querySelector('.hf-img.day').src = IMG_DAY;
document.querySelector('.hf-img.night').src = IMG_NIGHT;



/* ---------- soft SVG mattes ----------
   Each living layer is a static matte (outer .fx) over a slowly moving copy
   (.fx-move), so the window frame stays put while the foliage behind it sways. */
function svgMatte(rects, blur) {
  const body = rects
    .map((r) => `<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}"/>`)
    .join('');
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941">` +
    `<defs><filter id="b" x="-25%" y="-25%" width="150%" height="150%">` +
    `<feGaussianBlur stdDeviation="${blur}"/></filter></defs>` +
    `<g filter="url(#b)" fill="#fff">${body}</g></svg>`;
  return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
}

function applyMatte(el, matte) {
  if (!el) return;
  el.style.webkitMaskImage = matte;
  el.style.maskImage = matte;
  el.style.webkitMaskSize = '100% 100%';
  el.style.maskSize = '100% 100%';
  el.style.webkitMaskRepeat = 'no-repeat';
  el.style.maskRepeat = 'no-repeat';
}

/* glass panes only: the mullions (x 955/1095/1195/1295) and the tree trunk
   never travel. The trunk spans x 1290-1420, so the last column is left out. */
const GLASS = [
  [958, 58, 132, 86],
  [1106, 58, 84, 86],
  [1206, 58, 84, 86],
  [958, 166, 132, 122],
  [1106, 166, 84, 122],
  [1206, 166, 84, 122],
];

/* ---------- state ---------- */
let mode = 'day';
let busy = false;
let inWork = false;
let zoomed = false;
let lastZoom = '';
let s = 1, tx = 0, ty = 0;

try { const m = localStorage.getItem('hf-room-mode'); if (m === 'night' || m === 'day') mode = m; } catch (e) {}

/* ---------- layout ---------- */
function place(el, r) {
  el.style.left = r.x + 'px';
  el.style.top = r.y + 'px';
  el.style.width = r.w + 'px';
  el.style.height = r.h + 'px';
}

function layout() {
  const vw = Math.max(1, window.innerWidth);
  const vh = Math.max(1, window.innerHeight);
  s = Math.max(vw / WORLD.w, vh / WORLD.h);
  tx = (vw - WORLD.w * s) / 2;
  ty = (vh - WORLD.h * s) / 2;
  /* portrait phones: keep the cat and the monitor in frame */
  if (vh > vw * 1.05) {
    const want = vw / 2 - 1000 * s;
    tx = Math.min(0, Math.max(vw - WORLD.w * s, want));
  }
  stage.style.setProperty('--s', s.toFixed(4));
  stage.style.setProperty('--inv', (1 / s).toFixed(4));
  if (!zoomed) {
    if (!busy) stage.style.transitionDuration = '0ms';
    stage.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
    if (!busy) requestAnimationFrame(() => { stage.style.transitionDuration = ''; });
  }
  place(screenHot, SCREEN);
  place(catHot, CATS[mode]);
}

function zoomTransform() {
  const vw = Math.max(1, window.innerWidth);
  const vh = Math.max(1, window.innerHeight);
  const z = Math.max(vw / SCREEN.w, vh / SCREEN.h) * 1.02;
  const cx = SCREEN.x + SCREEN.w / 2;
  const cy = SCREEN.y + SCREEN.h / 2;
  return {
    z,
    transform: `translate(${(vw / 2 - z * cx).toFixed(2)}px, ${(vh / 2 - z * cy).toFixed(2)}px) scale(${z.toFixed(4)})`,
  };
}

/* ---------- motes ---------- */
(function buildMotes() {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 20; i++) {
    const m = document.createElement('div');
    m.className = 'hf-mote';
    const size = 3 + Math.random() * 5;
    m.style.left = (40 + Math.random() * 1580).toFixed(1) + 'px';
    m.style.top = (60 + Math.random() * 760).toFixed(1) + 'px';
    m.style.width = size.toFixed(1) + 'px';
    m.style.height = size.toFixed(1) + 'px';
    m.style.setProperty('--dur', (13 + Math.random() * 13).toFixed(1) + 's');
    m.style.setProperty('--delay', (-Math.random() * 22).toFixed(1) + 's');
    m.style.setProperty('--dx', (Math.random() * 90 - 45).toFixed(1) + 'px');
    frag.appendChild(m);
  }
  motes.appendChild(frag);
})();

/* ---------- day / night ---------- */
function setMode(next, persist) {
  mode = next === 'night' ? 'night' : 'day';
  root.classList.toggle('is-night', mode === 'night');
  modeBtn.setAttribute('aria-pressed', String(mode === 'night'));
  modeBtn.innerHTML = mode === 'day' ? '🌙 <span>夜晚</span>' : '☀️ <span>白天</span>';
  place(catHot, CATS[mode]);
  bubble.style.left = CATS[mode].bubble[0] + 'px';
  bubble.style.top = CATS[mode].bubble[1] + 'px';
  if (persist !== false) { try { localStorage.setItem('hf-room-mode', mode); } catch (e) {} }
}

/* ---------- cat ---------- */
let petTimer = 0;
function pet() {
  if (busy || inWork) return;
  // Animate the extracted cat sprite itself; never move the bedroom or the girl's face.
  catActor.classList.remove('is-playing');
  void catActor.offsetWidth;
  catActor.classList.add('is-playing');
  clearTimeout(pet.catTimer);
  pet.catTimer=setTimeout(()=>catActor.classList.remove('is-playing'),3300);

  const c = CATS[mode];
  const cx = c.x + c.w / 2;
  const cy = c.y + c.h * 0.52;

  // 不缩放整个房间：猫咪只显示它附近的爱心和呼噜反馈，人物保持不动。
  push.classList.remove('is-petting');

  catHot.classList.add('is-petted');
  setTimeout(() => catHot.classList.remove('is-petted'), 700);

  for (let i = 0; i < 3; i++) {
    const p = document.createElement('div');
    p.className = 'hf-pulse';
    const r = c.w * 0.42;
    p.style.left = cx - r + 'px';
    p.style.top = cy - r + 'px';
    p.style.width = r * 2 + 'px';
    p.style.height = r * 2 + 'px';
    p.style.animationDelay = i * 0.18 + 's';
    pulses.appendChild(p);
    setTimeout(() => p.remove(), 1700 + i * 180);
  }

  const icons = ['💗', '💕', '♡', '💛', '🐾'];
  for (let i = 0; i < 6; i++) {
    const h = document.createElement('span');
    h.className = 'hf-heart';
    h.textContent = icons[i % icons.length];
    h.style.left = cx + (Math.random() * 90 - 45) + 'px';
    h.style.top = cy - 10 + (Math.random() * 20 - 10) + 'px';
    h.style.setProperty('--dx', (Math.random() * 56 - 28).toFixed(0) + 'px');
    h.style.animationDelay = i * 0.07 + 's';
    h.style.fontSize = 18 + Math.random() * 14 + 'px';
    hearts.appendChild(h);
    setTimeout(() => h.remove(), 2400 + i * 80);
  }

  const lines = ['喵～ 摸摸最舒服了 ♡', '呼噜呼噜……再摸一下', '小猫把好运蹭给你了 🌷', '一起把今天过成心流吧 ✨'];
  bubble.textContent = lines[Math.floor(Math.random() * lines.length)];
  bubble.classList.add('show');
  clearTimeout(pet.timer);
  pet.timer = setTimeout(() => bubble.classList.remove('show'), 2100);
}

/* ---------- enter / leave the workbench ---------- */
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function enterWork() {
  if (busy || inWork) return;
  hfPauseRoomMusic();
  busy = true;
  bubble.classList.remove('show');
  push.classList.remove('is-petting');
  push.style.transform = '';
  root.classList.add('is-travelling');

  const z = zoomTransform();
  lastZoom = z.transform;
  zoomed = true;

  /* the dive always lands on the viewport centre, so flare from there */
  flare.style.setProperty('--fx', '50%');
  flare.style.setProperty('--fy', '50%');

  stage.style.transitionDuration = TRANS + 'ms';
  stage.style.transform = z.transform;
  setTimeout(() => {
    root.classList.add('is-fading');
    flare.classList.remove('is-on');
    void flare.offsetWidth;
    flare.classList.add('is-on');
  }, Math.max(0, TRANS - 420));

  await wait(TRANS + 10);

  inWork = true;
  busy = false;
  root.classList.add('is-hidden');
  root.classList.remove('is-fading', 'is-travelling');
  stage.style.transitionDuration = '0ms';
  stage.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  zoomed = false;
  document.body.classList.remove('room-mode');
  wbRoot.inert = false;
  wbRoot.removeAttribute('aria-hidden');
  back.hidden = false;
  window.scrollTo(0, 0);
  requestAnimationFrame(() => { stage.style.transitionDuration = ''; });
}

async function leaveWork() {
  if (busy || !inWork) return;
  const wbModal = document.getElementById('modal');
  if (wbModal && wbModal.classList.contains('open')) wbModal.classList.remove('open');
  busy = true;
  back.hidden = true;
  document.body.classList.add('room-mode');
  wbRoot.inert = true;
  wbRoot.setAttribute('aria-hidden', 'true');

  root.classList.add('is-fading');
  root.classList.remove('is-hidden');
  stage.style.transitionDuration = '0ms';
  stage.style.transform = lastZoom || zoomTransform().transform;
  zoomed = true;
  void root.offsetWidth;

  const base = `translate(${tx}px, ${ty}px) scale(${s})`;
  requestAnimationFrame(() => {
    stage.style.transitionDuration = TRANS + 'ms';
    stage.style.transform = base;
    root.classList.remove('is-fading');
    flare.classList.remove('is-on');
  });

  await wait(TRANS + 30);

  inWork = false;
  busy = false;
  zoomed = false;
  stage.style.transitionDuration = '';
  stage.style.transform = '';
  layout();
  hfResumeRoomMusic();
}

/* ---------- wire ---------- */
screenHot.addEventListener('click', enterWork);
chip.addEventListener('click', enterWork);
catHot.addEventListener('click', pet);
back.addEventListener('click', leaveWork);

modeBtn.addEventListener('click', () => setMode(mode === 'day' ? 'night' : 'day'));

fullBtn.addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen?.();
      try { await window.screen.orientation?.lock?.('landscape'); } catch (e) {}
    } else {
      await document.exitFullscreen?.();
    }
  } catch (e) {}
});
document.addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement;
  fullBtn.innerHTML = on ? '⛶ <span class="lbl">退出全屏</span>' : '⛶ <span class="lbl">全屏</span>';
  fullBtn.setAttribute('aria-pressed', String(on));
  layout();
});

const rotateBtn = $('hfRotateBtn');
if (rotateBtn) rotateBtn.addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
    await window.screen.orientation?.lock?.('landscape');
  } catch (e) {}
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && inWork) { e.preventDefault(); leaveWork(); }
});

window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 120));

/* ---------- boot ---------- */
setMode(mode, false);
hfTryRoomMusic();
layout();
requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('is-fading')));

setTimeout(() => {
  const hint = root.querySelector('.hf-hint');
  if (hint) hint.style.opacity = '0.62';
}, 9000);

/* ---------- playtest bridge ---------- */
window.__gameState = () => {
  const c = CATS[mode];
  return {
    phase: 'playing',
    score: 0,
    hearts: 3,
    fps: 60,
    hero: { x: c.x + c.w / 2, y: c.y + c.h / 2 },
    pickups: [],
    enemies: [],
    world: { w: WORLD.w, h: WORLD.h },
  };
};

const PLAN = RULE.plan || {};
let autoStep = 0;
window.__autoplay = () => {
  autoStep += 1;
  if (autoStep === (Number(PLAN.pet) || 4)) pet();
  if (autoStep === (Number(PLAN.enter) || 16)) enterWork();
  if (autoStep === (Number(PLAN.leave) || 58)) leaveWork();
  if (autoStep === (Number(PLAN.night) || 70)) setMode('night');
  if (autoStep === (Number(PLAN.pet2) || 76)) pet();
};

/* small hook used during development */
window.__hfRoom = { enterWork, leaveWork, pet, setMode, state: () => ({ mode, inWork, busy }) };

}catch(err){ hfFail((err&&err.stack)||String(err)); }
})();
